<!DOCTYPE html>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1200px;height:630px;overflow:hidden;background:#ffffff;
  font-family:{{font_family}};
  color:#111111;
}
.in{position:relative;padding:72px 84px;height:100%;display:flex;flex-direction:column}
.brand{font-size:20px;line-height:1.4;color:#666666;font-weight:400;letter-spacing:.01em}
h1{margin-top:44px;font-size:{{h1_size}}px;line-height:1.22;letter-spacing:-.015em;color:#111111;font-weight:700}
.topics{margin-top:28px;font-size:22px;line-height:1.55;color:#333333;max-width:1030px}
.stats{
  margin-top:auto;padding-top:28px;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 40px;
  font-size:18px;line-height:1.45;color:#666666;
}
.stats b{color:#111111;font-weight:700}
</style>
<div class="in">
    <div class="brand">{{ brand }}</div>
    <h1>
        {{ h1_line1 }}
        <br>
        {{ h1_line2 }}
    </h1>
    <p class="topics">{{ topics }}</p>
    <div class="stats">
        <span><b>{{ tips_n }}</b> {{ tips_label }}</span>
        <span>{{ grade_a_label }} — <b>{{ grade_a_n }}</b>{{ grade_a_suffix }}</span>
        <span><b>{{ links_n }}</b> {{ links_label }}</span>
        <span>{{ filter_label }}</span>
    </div>
</div>
