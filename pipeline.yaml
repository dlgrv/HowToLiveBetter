# Declarative pipeline topology for AI agents.
# Read by agents to understand the flow without reading code.

pipeline:
  sync:
    tool: docs/upstream-sync.md
    input: "upstream/main (git)"
    output: "updated book/*.md + README.zh.md"

  digest:
    tool: tools/make_digest.py
    input: "book/{chapter}.md"
    output: "tools/digest/{chapter}/units/"
    args: ["NN"]

  translate:
    tool: "manual (agent or subagent via delegation) or tools/llm/translate-wave.sh"
    input: "tools/digest/{chapter}/units/"
    output: "tools/runs/active/{lang}/{chapter}/units/"
    contract: "write-first: immediate write_file per unit"

  assemble:
    tool: tools/assemble.py
    input: "tools/runs/active/{lang}/{chapter}/units/"
    output: "book/{lang}/{chapter}-*.md"
    args: ["NN", "workdir", "out.md", "lang?"]
    depends: ["translate"]

  verify:
    tool: tools/verify.py
    input: "book/{lang}/{chapter}-*.md + book/{chapter}.md"
    output: "tools/.status/{chapter}-{lang}.ok"
    args: ["NN", "--lang", "ru|en|es"]
    exit_codes: {0: "pass", 1: "FAIL", 2: "WARN"}
    depends: ["assemble"]

  factcheck:
    tool: tools/validate/factcheck.py
    input: "one CN unit + one TR unit (unit-scoped)"
    output: "tools/validate/results/factcheck/{nn}-{lang}.json"
    args: ["--chapter", "NN", "--lang", "ru|en", "--cn-unit", "path", "--tr-unit", "path"]
    depends: ["translate"]

  style:
    tool: tools/style_check.py
    input: "tools/runs/active/{lang}/{chapter}/units/ or book/{lang}/…"
    output: "stdout"
    depends: ["translate"]

  wave:
    tool: tools/wave_pipeline.py
    input: "chapter list (positional NN…); always ru+en+es"
    output: "summary on stdout"
    depends: ["assemble", "verify"]

  web:
    tool: tools/build_pages.py
    input: "book/ + tools/v2.css + tools/langs.json"
    output: "site/{lang}/index.html + site/assets/"

  status:
    tool: tools/status.py
    input: "book/{ru,en,es}/ + tools/langs.json"
    output: "terminal dashboard"

paths:
  source: "book/"
  target: "book/{lang}/"
  run_cn: "tools/digest/{chapter}/units/"
  run_lang: "tools/runs/active/{lang}/{chapter}/"
  digest: "tools/digest/"
  status: "tools/.status/"
