<svg xmlns="http://www.w3.org/2000/svg" width="972" height="176" viewBox="0 0 972 176" role="img" aria-label="Repair wave">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #1f2328;
    }
    .edge { font-size: 10px; fill: #656d76; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .dia { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .arr { fill: none; stroke: #656d76; stroke-width: 1.25; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#656d76"/>
    </marker>
  </defs>

  <!-- boxes first -->
  <rect class="box" x="8" y="72" width="108" height="32"/><text x="62" y="92" text-anchor="middle">Verify FAIL</text>
  <rect class="box" x="156" y="72" width="108" height="32"/><text x="210" y="92" text-anchor="middle">Repair</text>
  <polygon class="dia" points="358,72 412,88 358,104 304,88"/>
  <text x="358" y="92" text-anchor="middle" font-size="11">≤3 rounds?</text>

  <rect class="box" x="452" y="20" width="108" height="32"/><text x="506" y="40" text-anchor="middle">Assemble</text>
  <rect class="box" x="600" y="20" width="108" height="32"/><text x="654" y="40" text-anchor="middle">Verify</text>
  <rect class="box" x="748" y="20" width="108" height="32"/><text x="802" y="40" text-anchor="middle">→ make lt</text>
  <rect class="box" x="452" y="124" width="108" height="32"/><text x="506" y="144" text-anchor="middle">STOP</text>

  <!-- arrows on top, tips at box edges -->
  <path class="arr" d="M116 88 H156" marker-end="url(#a)"/>
  <path class="arr" d="M264 88 H304" marker-end="url(#a)"/>

  <!-- yes / no: line + explicit arrowhead into left edge (markers leave a gap on elbows) -->
  <path class="arr" d="M412 88 H432 V36 H452"/>
  <polygon points="452,36 440,30 440,42" fill="#656d76"/>
  <text class="edge" x="434" y="30">yes</text>

  <path class="arr" d="M412 88 H432 V140 H452"/>
  <polygon points="452,140 440,134 440,146" fill="#656d76"/>
  <text class="edge" x="434" y="154">no</text>

  <path class="arr" d="M560 36 H600" marker-end="url(#a)"/>
  <path class="arr" d="M708 36 H748" marker-end="url(#a)"/>
</svg>
