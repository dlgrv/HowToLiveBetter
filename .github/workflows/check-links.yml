name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve every relative markdown link from its file's directory
        run: python3 tools/check_links.py
      - name: Content gates (CJK leaks, filename language, parity, badge stats)
        run: python3 tools/check_content.py
      - name: Verify gate for retranslated chapters (book/ru vs CN)
        run: |
          if [ ! -f docs/.retranslate-pending ]; then
            echo "no retranslate-pending list — skipping verify gate"
            exit 0
          fi
          pending=$(grep -vE '^\s*(#|$)' docs/.retranslate-pending | tr -d ' ')
          failed=0
          for nn in $pending; do
            f=$(ls book/ru/${nn}-*.md 2>/dev/null | head -1)
            [ -z "$f" ] && continue
            if ! python3 tools/verify.py "$nn" --lang ru > /tmp/v_$nn.log 2>&1; then
              echo "ch.$nn FAILED:"; tail -5 /tmp/v_$nn.log; failed=1
            else
              echo "ch.$nn OK"
            fi
          done
          exit $failed

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pipeline unit tests
        run: python3 -m unittest discover -s tools/llm/tests -v
