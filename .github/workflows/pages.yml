name: pages
# GitHub Pages no longer mirrors the book. It serves a permanent redirect to
# book.dlgrv.com (the canonical site) so old dlgrv.github.io links keep working.
# Deep links are preserved by the JS in 404.html (GitHub Pages serves it for
# unknown paths). Rebuilds only when the redirect page itself changes.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/pages-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage redirect site
        run: |
          mkdir -p .publish
          cp deploy/pages-redirect/index.html .publish/index.html
          cp deploy/pages-redirect/404.html .publish/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .publish
      - id: deployment
        uses: actions/deploy-pages@v4
