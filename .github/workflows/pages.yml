name: pages
# GitHub Pages is a redirect stub to https://book.dlgrv.com (canonical book host).

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Stage redirect stub
        run: |
          mkdir -p .publish
          cat > .publish/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://book.dlgrv.com/">
            <link rel="canonical" href="https://book.dlgrv.com/">
            <title>Moved to book.dlgrv.com</title>
            <script>
            location.replace(
              'https://book.dlgrv.com/'
              + location.pathname.replace(/^\\/HowToLiveBetter\\/?/, '')
              + location.search + location.hash
            );
            </script>
          </head>
          <body>
            <p>This book now lives at <a href="https://book.dlgrv.com/">book.dlgrv.com</a>.</p>
          </body>
          </html>
          HTML
          # Also redirect common locale paths via meta pages
          for lang in en ru zh es pt ar id; do
            mkdir -p ".publish/$lang"
            cat > ".publish/$lang/index.html" <<HTML
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=https://book.dlgrv.com/$lang/">
          <link rel="canonical" href="https://book.dlgrv.com/$lang/">
          <script>location.replace('https://book.dlgrv.com/$lang/'+location.search+location.hash)</script>
          <p><a href="https://book.dlgrv.com/$lang/">Continue</a></p>
          HTML
          done
          mkdir -p .publish/login
          cat > .publish/login/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=https://book.dlgrv.com/login/">
          <link rel="canonical" href="https://book.dlgrv.com/login/">
          <script>location.replace('https://book.dlgrv.com/login/'+location.search+location.hash)</script>
          <p><a href="https://book.dlgrv.com/login/">Continue</a></p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
