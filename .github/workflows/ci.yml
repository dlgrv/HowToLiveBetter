name: test
# Unit + integration tests for the translation pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Commit message style
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          failed=0
          for c in $(git rev-list --no-merges "$base"..HEAD); do
            echo "── checking $c ──"
            if ! git log -1 --format=%B "$c" | .venv/bin/python3 tools/check_commit_msg.py --stdin; then
              failed=1
            fi
          done
          exit $failed
      - name: Run unit tests
        run: make test
      - name: Run integration tests
        run: make test-integration
      - name: Lint
        run: make lint
      - name: Link check
        run: .venv/bin/python3 tools/check_links.py
      - name: Content check
        run: .venv/bin/python3 tools/check_content.py
      - name: Build pages
        run: |
          .venv/bin/python3 tools/build_pages.py
          test -f site/en/index.html
          test -f site/assets/v2.css
          test -f site/assets/og/en.png
      - name: Stage Pages artifact
        run: |
          .venv/bin/python3 tools/pages_artifact.py
          test -f .publish/en/index.html
          test -f .publish/README.md
          test -d .publish/book
      - name: Check for committed bytecode
        run: |
          if git ls-files '**/__pycache__/*' | grep -q .; then
            echo "ERROR: .pyc files committed to git"
            git ls-files '**/__pycache__/*'
            exit 1
          fi
      - name: Verify retranslated chapters
        run: |
          if [ ! -f docs/.retranslate-pending ]; then
            echo "no retranslate-pending list — skipping"
            exit 0
          fi
          pending=$(grep -vE '^\s*(#|$)' docs/.retranslate-pending | tr -d ' ')
          failed=0
          for nn in $pending; do
            f=$(ls book/ru/${nn}-*.md 2>/dev/null | head -1)
            [ -z "$f" ] && continue
            if ! .venv/bin/python3 tools/verify.py "$nn" --lang ru > /tmp/v_$nn.log 2>&1; then
              echo "ch.$nn FAILED:"; tail -5 /tmp/v_$nn.log; failed=1
            else
              echo "ch.$nn OK"
            fi
          done
          exit $failed

  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Content quality gates
        run: make quality
        continue-on-error: true
