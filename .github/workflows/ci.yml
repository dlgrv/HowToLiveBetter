name: pytest
# pytest-тесты пайплайна (30 тестов). Основной CI (links, content, verify,
# unittest) — в check-links.yml как "ci".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Generate digest fixtures
        run: python3 tools/make_digest.py 01
      - name: Run tests
        run: >
          python3 -m pytest tools/validate/tests/ tools/llm/tests/ -v
          --ignore=tools/validate/tests/test_build_lite3.py
          --ignore=tools/validate/tests/test_golden_pairs.py
          --ignore=tools/validate/tests/test_mutation_spec.py
          --ignore=tools/validate/tests/test_style_check.py
          -k "not test_load_book_ru_ch01"