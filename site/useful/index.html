var USEFUL_READMES = {
  en: 'README.md', ru: 'README.ru.md', zh: 'README.zh.md',
  es: 'README.es.md', pt: 'README.pt.md', ar: 'README.ar.md', id: 'README.id.md'
};

function resolveUsefulLang() {
  var p = new URLSearchParams(location.search);
  var lang = (p.get('lang') || '').toLowerCase();
  if (USEFUL_I18N[lang]) return lang;
  try { lang = (localStorage.getItem('htlb-lang') || '').toLowerCase(); } catch (e) {}
  if (USEFUL_I18N[lang]) return lang;
  if (navigator.language) lang = navigator.language.slice(0, 2).toLowerCase();
  return USEFUL_I18N[lang] ? lang : 'en';
}

function applyUsefulLang() {
  var lang = resolveUsefulLang();
  window.__HTLB_LANG__ = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  var t = USEFUL_I18N[lang];
  document.title = t.docTitle;
  document.getElementById('useful-title').textContent = t.title;
  document.getElementById('useful-hint').textContent = t.hint;
  document.getElementById('useful-empty').textContent = t.empty;
  var back = document.getElementById('useful-back');
  back.textContent = t.back;
  back.href = '../' + lang + '/';

  window.T = function () {
    return {
      accountUseful: t.accountUseful,
      accountSignIn: lang === 'ru' ? 'Войти' : lang === 'zh' ? '登录' : 'Sign in',
      accountLogout: lang === 'ru' ? 'Выйти' : lang === 'zh' ? '退出' : 'Log out',
      accountSignedIn: lang === 'ru' ? 'Вы вошли' : lang === 'zh' ? '已登录' : 'Signed in',
      accountAria: lang === 'ru' ? 'Аккаунт' : lang === 'zh' ? '账户' : 'Account',
      usefulLabel: lang === 'ru' ? 'Полезно' : lang === 'zh' ? '有用' : 'Useful'
    };
  };
}

applyUsefulLang();
</script>
<script src="../assets/interactive.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.HTLBInteractive && HTLBInteractive.initUsefulPage) {
    HTLBInteractive.initUsefulPage({
      readmes: USEFUL_READMES,
      i18n: USEFUL_I18N[resolveUsefulLang()]
    });
  }
});
</script>
