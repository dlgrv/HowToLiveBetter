<script>
window.__HTLB_API__ = 'https://api.dlgrv.com/api/htlb/v1';
window.__HTLB_PB__ = 'https://api.dlgrv.com';

var LOGIN_I18N = {
  en: {
    title: 'Sign in',
    hint: 'Sign in so that on any of your devices you can continue reading where you left off, and keep which recommendations you marked as useful.',
    google: 'Continue with Google',
    github: 'Continue with GitHub',
    back: 'Back to the book',
    docTitle: 'Sign in · HowToLiveBetter'
  },
  ru: {

    hint: 'Войдите, чтобы на любом устройстве продолжать чтение с того места, где остановились, и сохранять отметки «Полезно» у рекомендаций.',
    google: 'Войти через Google',
    github: 'Войти через GitHub',
    back: 'Обратно к книге',
    docTitle: 'Вход · HowToLiveBetter'
  },
  zh: {
    title: '登录',
    hint: '登录后，可在任意设备从上次停下的地方继续阅读，并保留你对条目的「有用」标记。',
    google: '使用 Google 登录',
    github: '使用 GitHub 登录',
    back: '返回书籍',
    docTitle: '登录 · HowToLiveBetter'
  },
  es: {
    title: 'Iniciar sesión',
    hint: 'Inicia sesión para, en cualquier dispositivo, seguir leyendo donde lo dejaste y conservar qué recomendaciones marcaste como útiles.',
    google: 'Continuar con Google',
    github: 'Continuar con GitHub',
    back: 'De vuelta al libro',
    docTitle: 'Iniciar sesión · HowToLiveBetter'
  },
  pt: {
    title: 'Entrar',
    hint: 'Entre para, em qualquer dispositivo, continuar a leitura de onde parou e guardar quais recomendações marcou como úteis.',
    google: 'Continuar com Google',
    github: 'Continuar com GitHub',
    back: 'De volta ao livro',
    docTitle: 'Entrar · HowToLiveBetter'
  },
  ar: {
    title: 'تسجيل الدخول',
    hint: 'سجّل الدخول لتتابع القراءة من حيث توقفت على أي جهاز، وتحتفظ بعلامة «مفيد» على التوصيات.',
    google: 'المتابعة مع Google',
    github: 'المتابعة مع GitHub',
    back: 'العودة إلى الكتاب',
    docTitle: 'تسجيل الدخول · HowToLiveBetter'
  },
  id: {
    title: 'Masuk',
    hint: 'Masuk agar di perangkat mana pun Anda bisa lanjut membaca dari tempat terakhir, dan menyimpan tanda «Berguna» pada rekomendasi.',
    google: 'Lanjut dengan Google',
    github: 'Lanjut dengan GitHub',
    back: 'Kembali ke buku',
    docTitle: 'Masuk · HowToLiveBetter'
  }
};

function resolveLoginLang() {
  var p = new URLSearchParams(location.search);
  var lang = (p.get('lang') || '').toLowerCase();
  if (LOGIN_I18N[lang]) return lang;
  try { lang = (localStorage.getItem('htlb-lang') || '').toLowerCase(); } catch (e) {}
  if (LOGIN_I18N[lang]) return lang;
  if (navigator.language) lang = navigator.language.slice(0, 2).toLowerCase();
  return LOGIN_I18N[lang] ? lang : 'en';
}

function applyLoginLang() {
  var lang = resolveLoginLang();
  window.__HTLB_LANG__ = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  var t = LOGIN_I18N[lang];
  document.title = t.docTitle;
  document.getElementById('login-title').textContent = t.title;
  document.getElementById('login-hint').textContent = t.hint;
  document.getElementById('login-google-label').textContent = t.google;
  document.getElementById('login-github-label').textContent = t.github;
  var back = document.getElementById('login-back');
  back.textContent = t.back;
  back.href = '../' + lang + '/';

  window.T = function () {
    return {
      accountGoogle: t.google,
      accountGithub: t.github,
      accountHint: t.hint,
      accountSignIn: t.title,
      accountLogout: lang === 'ru' ? 'Выйти' : lang === 'zh' ? '退出' : 'Log out',
      accountSignedIn: lang === 'ru' ? 'Вы вошли' : lang === 'zh' ? '已登录' : 'Signed in',
      accountAria: t.title
    };
  };
}

applyLoginLang();
</script>

});
</script>
