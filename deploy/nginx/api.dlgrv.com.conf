# /etc/nginx/sites-available/api.dlgrv.com.conf
# TLS cert: shared Let's Encrypt line under live/book.dlgrv.com (SAN includes api).

server {
    listen 178.104.217.93:80;
    listen 127.0.0.1:80;
    server_name api.dlgrv.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 178.104.217.93:443 ssl;
    listen 127.0.0.1:443 ssl;
    server_name api.dlgrv.com;

    ssl_certificate     /etc/letsencrypt/live/book.dlgrv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.dlgrv.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    # Public: PocketBase OAuth popup lands on /_/#/auth/oauth2-* after
    # /api/oauth2-redirect. Admin UI still requires a superuser login.
    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
