# /etc/nginx/sites-available/book.dlgrv.com.conf
# Bind public IP only — Tailscale may already own :80 on the TS address.
# Cert lives at /etc/letsencrypt/live/book.dlgrv.com/ (SAN also covers api).

server {
    listen 178.104.217.93:80;
    listen 127.0.0.1:80;
    server_name book.dlgrv.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 178.104.217.93:443 ssl;
    listen 127.0.0.1:443 ssl;
    server_name book.dlgrv.com;

    ssl_certificate     /etc/letsencrypt/live/book.dlgrv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.dlgrv.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/book.dlgrv.com/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
